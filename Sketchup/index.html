
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Sketchup - Gerardo Parizzi</title>
    <link rel="stylesheet" href="../estilo.css">
    <style>
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; text-align: center; }
        .galeria { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 30px auto; max-width: 1200px; }
        .tarjeta { background: #1e1e1e; padding: 15px; border-radius: 8px; width: 300px; text-align: center; }
        .tarjeta img { width: 100%; border-radius: 4px; }
        .boton { background: #333; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>Gerardo Parizzi</h1>
        <p>Arquitectura y Proyectos - Sketchup</p>
    </header>

    <main>
        <div class="galeria">
            <!-- REPETÍ ESTE BLOQUE PARA CADA IMAGEN NUEVA -->
            <div class="tarjeta">
                <img src="ANIBAL-CORTE TRANSVERSAL.jpg" alt="Corte">
                <p>Anibal - Corte Transversal</p>
            </div>
            <div class="tarjeta">
                <img src="ANIBAL-VISTA ESTE.jpg" alt="Vista Este">
                <p>Anibal - Vista Este</p>
            </div>
            <div class="tarjeta">
                <img src="ARKA 1-04-planta.jpg" alt="Planta">
                <p>Arka 1-04 - Planta</p>
            </div>
            <!-- FIN DEL BLOQUE -->
        </div>

        <div style="margin: 40px;">
            <a href="../galerias.html" class="boton">Volver a Galerías</a>
        </div>
    </main>

</body>
</html>
