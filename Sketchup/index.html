<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Sketchup - Gerardo Parizzi</title>
    <link rel="stylesheet" href="../estilo.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>Gerardo Parizzi</h1>
            <p>Arquitectura y Proyectos</p>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Galería Sketchup</h2>
                <p>Proyectos modelados en Sketchup.</p>
            </div>
        </section>

        <!-- Contenedor de la galería -->
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 30px auto; max-width: 1200px;">
            
            <div style="background: #1e1e1e; padding: 15px; border-radius: 8px; width: 300px; text-align: center;">
                <img src="ANIBAL-CORTE TRANSVERSAL.jpg" alt="Corte Transversal Anibal" style="width: 100%; border-radius: 4px;">
                <p style="margin-top: 10px; color: #fff;">Anibal - Corte Transversal</p>
            </div>

            <div style="background: #1e1e1e; padding: 15px; border-radius: 8px; width: 300px; text-align: center;">
                <img src="ANIBAL-VISTA ESTE.jpg" alt="Vista Este Anibal" style="width: 100%; border-radius: 4px;">
                <p style="margin-top: 10px; color: #fff;">Anibal - Vista Este</p>
            </div>

            <div style="background: #1e1e1e; padding: 15px; border-radius: 8px; width: 300px; text-align: center;">
                <img src="ARKA 1-04-planta.jpg" alt="Arka Planta" style="width: 100%; border-radius: 4px;">
                <p style="margin-top: 10px; color: #fff;">Arka 1-04 - Planta</p>
            </div>

        </div>

        <div style="margin-top: 40px; text-align: center;">
            <a href="../galerias.html" class="boton">Volver a Galerías</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Gerardo Parizzi. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
