!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Modelados - Gerardo Parizzi</title>
    <style>
        /* Estilos específicos para la galería de logos */
        .logo-gallery {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 20px;
        }
        .logo-item {
            text-align: center;
            width: 150px; /* Tamaño base de cada contenedor */
        }
        .logo-item img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .logo-title {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Gerardo Parizzi</div>
    </header>

    <main>
        <h1>Modelados</h1>
        <p>Espacio dedicado a la visualización de proyectos, volúmenes y geometrías digitales.</p>
        <p>Herramientas de software principales utilizadas en el flujo de trabajo:</p>
        
        <!-- Galería de Logos de Software -->
        <div class="logo-gallery">
            
            <!-- AutoCAD -->
            <div class="logo-item">
                <img src="ruta/a/tu/imagen_de_autocad.png" alt="AutoCAD Logo">
                <div class="logo-title">AutoCAD</div>
            </div>

            <!-- 3ds Max -->
            <div class="logo-item">
                <img src="ruta/a/tu/imagen_de_3dsmax.png" alt="3ds Max Logo">
                <div class="logo-title">3ds Max</div>
            </div>

            <!-- Rhinoceros -->
            <div class="logo-title">
                <img src="ruta/a/tu/imagen_de_rhino.png" alt="Rhinoceros Logo">
                <div class="logo-title">Rhino</div>
            </div>

            <!-- SketchUp -->
            <div class="logo-item">
                <img src="ruta/a/tu/imagen_de_sketchup.png" alt="SketchUp Logo">
                <div class="logo-title">SketchUp</div>
            </div>

        </div>

        <!-- Botón para volver al inicio -->
        <div style="margin-top: 50px;">
            <a href="index.html" class="boton" style="display: inline-block; text-decoration: none; padding: 10px 20px; background: #333; color: #fff; border-radius: 5px;">Volver al inicio</a>
        </div>
    </main>

</body>
</html>
