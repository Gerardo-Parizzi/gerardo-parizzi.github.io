
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de Gerardo Parizzi</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
        h1 { text-align: center; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 40px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Mi Galería de Proyectos</h1>

    <h2>3dMax</h2>
    <div class="gallery">
        <img src="3dMax/imagen2.jpg" alt="Imagen 2">
        <img src="3dMax/refugio.jpg" alt="Refugio">
        <img src="3dMax/douglas.jpg" alt="Douglas">
        <img src="3dMax/imagen3.jpg" alt="Imagen 3">
        <img src="3dMax/Scorpion.jpg" alt="Scorpion">
        <img src="3dMax/Enterprise.jpg" alt="Enterprise">
    </div>

    <h2>Rinoceronte</h2>
    <div class="gallery">
        <p>Carpeta Rinoceronte lista para tus imágenes.</p>
    </div>

    <h2>Sketchup</h2>
    <div class="gallery">
        <p>Carpeta Sketchup lista para tus imágenes.</p>
    </div>

</body>
</html>
