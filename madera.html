<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Madera - Gerardo Parizzi</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { margin-bottom: 20px; font-size: 22px; text-align: center; }
        .calc-container { background-color: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); box-sizing: border-box; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input, select { padding: 10px; background-color: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px; }
        button { background-color: #795548; color: #ffffff; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.3s; }
        button:hover { background-color: #5d4037; }
        .resultado { margin-top: 20px; padding: 15px; background-color: #252525; border-left: 4px solid #795548; border-radius: 4px; font-size: 14px; display: none; }
        .btn-volver { margin-top: 30px; color: #aaa; text-decoration: none; font-size: 14px; }
        .btn-volver:hover { color: #fff; }
    </style>
</head>
<body>

    <h1>Estructuras de Madera</h1>

    <div class="calc-container">
        <div class="form-group">
            <label for="elemento">Tipo de elemento:</label>
            <select id="elemento">
                <option value="viga">Viga a Flexión</option>
                <option value="columna">Columna a Compresión</option>
            </select>
        </div>
        <div class="form-group">
            <label for="carga">Carga actuante (kg):</label>
            <input type="number" id="carga" placeholder="Ej: 500">
        </div>
        <div class="form-group">
            <label for="luz">Luz o altura (m):</label>
            <input type="number" id="luz" step="0.1" placeholder="Ej: 3">
        </div>
        <button onclick="calcularMadera()">Calcular Sección</button>

        <div id="divResultado" class="resultado">
            <strong>Resultado:</strong>
            <p id="textoResultado"></p>
        </div>
    </div>

    <a href="calculos.html" class="btn-volver">Volver al Menú Principal</a>

    <script>
        function calcularMadera() {
            const elemento = document.getElementById('elemento').value;
            const carga = parseFloat(document.getElementById('carga').value);
            const luz = parseFloat(document.getElementById('luz').value);
            const divRes = document.getElementById('divResultado');
            const txtRes = document.getElementById('textoResultado');

            if (!carga || !luz) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            let resultado = "";
            if (elemento === "viga") {
                resultado = `Para una viga de ${luz} m con una carga de ${carga} kg, verificar flexión. Sección sugerida mínima: 2" x 6".`;
            } else {
                resultado = `Para una columna de ${luz} m con una carga de ${carga} kg, verificar pandeo y compresión. Sección sugerida mínima: 4" x 4".`;
            }
            
            divRes.style.display = "block";
            txtRes.innerHTML = resultado;
        }
    </script>
</body>
</html>
