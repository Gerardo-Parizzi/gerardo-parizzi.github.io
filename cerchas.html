<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Cerchas - Gerardo Parizzi</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { margin-bottom: 20px; font-size: 22px; text-align: center; }
        .calc-container { background-color: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); box-sizing: border-box; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input, select { padding: 10px; background-color: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px; }
        button { background-color: #4caf50; color: #121212; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.3s; }
        button:hover { background-color: #388e3c; }
        .resultado { margin-top: 20px; padding: 15px; background-color: #252525; border-left: 4px solid #4caf50; border-radius: 4px; font-size: 14px; display: none; }
        .btn-volver { margin-top: 30px; color: #aaa; text-decoration: none; font-size: 14px; }
        .btn-volver:hover { color: #fff; }
    </style>
</head>
<body>

    <h1>Dimensionamiento de Cerchas</h1>

    <div class="calc-container">
        <div class="form-group">
            <label for="luz">Luz de la cercha (m):</label>
            <input type="number" id="luz" step="0.1" placeholder="Ej: 8.0">
        </div>
        <div class="form-group">
            <label for="altura">Altura de la cercha (m):</label>
            <input type="number" id="altura" step="0.05" placeholder="Ej: 1.2">
        </div>
        <div class="form-group">
            <label for="carga">Carga distribuida sobre cubierta (kg/m²):</label>
            <input type="number" id="carga" step="5" placeholder="Ej: 150">
        </div>
        <div class="form-group">
            <label for="tipo">Tipo de Cercha:</label>
            <select id="tipo">
                <option value="cremona">Cremona</option>
                <option value="ritter">Ritter (Pratt)</option>
            </select>
        </div>
        <button onclick="calcularCercha()">Calcular Esfuerzos</button>

        <div id="divResultado" class="resultado">
            <strong>Resultado:</strong>
            <p id="textoResultado"></p>
        </div>
    </div>

    <a href="hierro.html" class="btn-volver">Volver a Estructuras Metálicas</a>

    <script>
        function calcularCercha() {
            const luz = parseFloat(document.getElementById('luz').value);
            const altura = parseFloat(document.getElementById('altura').value);
            const carga = parseFloat(document.getElementById('carga').value);
            const tipo = document.getElementById('tipo').value;
            const divRes = document.getElementById('divResultado');
            const txtRes = document.getElementById('textoResultado');

            if (!luz || !altura || !carga) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            // Estimación general de cargas y reacciones
            let cargaTotalAprox = carga * luz; 
            let esfuerzoCordon = (cargaTotalAprox * Math.pow(luz, 2)) / (8 * altura);
            
            divRes.style.display = "block";
            txtRes.innerHTML = `Para una cercha tipo ${tipo} de ${luz} m de luz y ${altura} m de altura, con una carga de ${carga} kg/m², el esfuerzo estimado en el cordón es de ${esfuerzoCordon.toFixed(2)} kg. Verificar barras componentes.`;
        }
    </script>
</body>
</html>
