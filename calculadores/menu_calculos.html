    <title>Menú de Cálculos Estructurales</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #333;
            box-sizing: border-box;
            text-align: center;
        }
        h2 { color: #4CAF50; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; font-size: 15px; }
        
        .btn-menu {
            display: block;
            background-color: #2c2c2c;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #444;
            transition: all 0.3s ease;
            box-sizing: border-box;
            width: 100%;
        }
        .btn-menu:hover {
            background-color: #4CAF50;
            border-color: #45a049;
            transform: translateY(-2px);
        }
        .btn-volver {
            background-color: #444;
            border: 1px solid #555;
            margin-top: 15px;
        }
        .btn-volver:hover {
            background-color: #555;
        }
