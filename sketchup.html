<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería SketchUp - Gerardo Parizzi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 40px; margin: 0; }
        .container { background-color: white; padding: 40px; border-radius: 8px; max-width: 1100px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; color: #111; }
        .galeria-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 30px; justify-content: center; }
        .item-foto { width: 220px; background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 4px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-foto img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; }
        .item-foto p { font-size: 0.85rem; color: #444; margin: 10px 0 0 0; word-break: break-all; }
        .btn-volver { display: inline-block; margin-top: 30px; background-color: #333; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Galería: SketchUp</h1>
        <div class="galeria-grid" id="gallery">
            <!-- Se carga automáticamente -->
        </div>
        <a href="galerias.html" class="btn-volver">Volver a Galerías</a>
    </div>

    <script>
        const imagenes = [
            "3A-06.jpg", "abierta.jpg", "adapt photography.jpg", "aerea 2.jpg", "aerea-3.jpg", 
            "aerea-7.jpg", "alter mall.jpg", "alter mall-01.jpg", "amancio rhino.jpg", "ANIBAL-VISTA ESTE.jpg", 
            "ANIBAL-VISTA NOFGD.jpg", "ANIBAL-VISTA OESTE.jpg", "ANIBAL-VISTA PLANTA.jpg", "ANIBAL-VISTA SUR.jpg", 
            "ARKA 1-04-planta.jpg", "ARKA 1-04-vista norte.jpg", "ARKA 1-04-vista sur.jpg", "ARKA 1-05.jpg", 
            "asador 3.jpg", "asador vista lateral.jpg", "asador vista.jpg", "auto-01.jpg", "auto-03.jpg", 
            "axo dos.jpg", "axo color.jpg", "axo.jpg", "boceto arranque.jpg", "celdas solares-1.jpg", 
            "celdas solares-2.jpg", "cerrada full.jpg", "citta romana-trie.jpg", "corte con paño abierto sin vegetacion.jpg", 
            "corte con paño cerrado y sin vegetacion.jpg", "corte con paño.jpg", "corte perspectivado.jpg", 
            "corte.jpg", "desde el mar 1.jpg", "desde el mar 2.jpg", "desde el mar 3.jpg", "detalles 2.jpg", 
            "diseño de equipamiento-01.jpg", "diseño de equipamiento-02.jpg", "diseño de equipamiento-03.jpg", 
            "estructura en el eje E.jpg", "expansion jardin casa.jpg", "fachada posterior.jpg", 
            "fachada principal.jpg", "full.jpg", "full-r.jpg", "IGLU-3D-01.jpg", "IGLU-3D-02.jpg", 
            "IGLU-3D-03.jpg", "IGLU-3D-04.jpg", "IGLU-3D-07.jpg", "IGLU-3D-08.jpg", "imagen1.jpg", 
            "imagen2.jpg", "las dos torres.jpg", "manzana 46-10.jpg", "manzana 46-11.jpg", "manzana 46-12.jpg", 
            "Master plan-con cabin-02.jpg", "muv-3d-03-01.jpg", "overcraft-2.jpg", "overcraft-3.jpg", 
            "ozy stand.jpg", "PANEL ABIERTO.jpg", "PANEL CERRADO.jpg", "PANELES ABIERTOS.jpg",

            "Susuki-3d-12.jpg", "torre dos.jpg", "valk-03.jpg"
        ];
        const gallery = document.getElementById('gallery');
        imagenes.forEach(nombre => {
            const div = document.createElement('div');
            div.className = 'item-foto';
            div.innerHTML = `<img src="carpeta-sketchup/${nombre}" alt="${nombre}"><p>${nombre}</p>`;
            gallery.appendChild(div);
        });
    </script>
</body>
</html>
