<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería SketchUp - Gerardo Parizzi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #111;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .card {
            background: #eee;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 2px;
        }
        .filename {
            font-size: 0.75rem;
            margin-top: 6px;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-volver {
            display: inline-block;
            margin-top: 30px;
            background-color: #777;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn-volver:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Galería: SketchUp</h1>
        <div class="grid" id="gallery-sketchup"></div>
        <a href="galerias.html" class="btn-volver">← Volver a Galerías</a>
