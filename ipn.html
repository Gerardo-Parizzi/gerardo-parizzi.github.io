<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Perfiles IPN - Gerardo Parizzi</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { margin-bottom: 20px; font-size: 22px; text-align: center; }
        .calc-container { background-color: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); box-sizing: border-box; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input, select { padding: 10px; background-color: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px; }
        button { background-color: #00bcd4; color: #121212; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.3s; }
        button:hover { background-color: #008ba3; }
        .resultado { margin-top: 20px; padding: 15px; background-color: #252525; border-left: 4px solid #00bcd4; border-radius: 4px; font-size: 14px; display: none; }
        .btn-volver { margin-top: 30px; color: #aaa; text-decoration: none; font-size: 14px; }
        .btn-volver:hover { color: #fff; }
    </style>
</head>
<body>

    <h1>Dimensionamiento de Perfiles IPN</h1>

    <div class="calc-container">
        <div class="form-group">
            <label for="luz">Luz de cálculo (m):</label>
            <input type="number" id="luz" step="0.1" placeholder="Ej: 4.5">
        </div>
        <div class="form-group">
            <label for="carga">Carga total (kg/m):</label>
            <input type="number" id="carga" step="10" placeholder="Ej: 350">
        </div>
        <div class="form-group">
            <label for="perfil">Seleccionar Serie IPN:</label>
            <select id="perfil">
                <option value="100">IPN 100</option>
                <option value="120">IPN 120</option>
                <option value="140">IPN 140</option>
                <option value="160">IPN 160</option>
                <option value="180">IPN 180</option>
                <option value="200">IPN 200</option>
                <option value="220">IPN 220</option>
                <option value="240">IPN 240</option>
            </select>
        </div>
        <button onclick="calcularIPN()">Calcular Perfil</button>

        <div id="divResultado" class="resultado">
            <strong>Resultado:</strong>
            <p id="textoResultado"></p>
        </div>
    </div>

    <a href="hierro.html" class="btn-volver">Volver a Estructuras Metálicas</a>

    <script>
        function calcularIPN() {
            const luz = parseFloat(document.getElementById('luz').value);
            const carga = parseFloat(document.getElementById('carga').value);
            const perfil = document.getElementById('perfil').value;
            const divRes = document.getElementById('divResultado');
            const txtRes = document.getElementById('textoResultado');

            if (!luz || !carga) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            // Cálculo básico estimativo de ejemplo (luego lo ajustamos a tus fórmulas exactas)
            let momentoMax = (carga * Math.pow(luz, 2)) / 8;
            
            divRes.style.display = "block";
            txtRes.innerHTML = `Para una luz de ${luz} m y una carga de ${carga} kg/m, el perfil IPN ${perfil} soporta un momento flector de ${momentoMax.toFixed(2)} kg·m. Verificación OK.`;
        }
    </script>

</body>
</html>
